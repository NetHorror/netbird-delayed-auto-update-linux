name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: bash -n netbird-delayed-update-linux.sh

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make executable
        run: chmod +x netbird-delayed-update-linux.sh

      - name: Run once (NetBird not installed -> should exit cleanly)
        run: sudo ./netbird-delayed-update-linux.sh --delay-days 0 --max-random-delay-seconds 0

      - name: Install systemd units
        run: sudo ./netbird-delayed-update-linux.sh --install --daily-time "04:00" --max-random-delay-seconds 0

      - name: Verify systemd units were created
        run: |
          systemctl status netbird-delayed-update.timer --no-pager
          systemctl list-timers --all | grep -q netbird-delayed-update

      - name: Uninstall systemd units
        run: sudo ./netbird-delayed-update-linux.sh --uninstall --remove-state

      - name: Verify systemd units were removed
        run: |
          if systemctl list-unit-files | grep -q netbird-delayed-update; then
            echo "systemd units still present after uninstall" >&2
            exit 1
          fi

  tag-matches-version:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          tag="${GITHUB_REF_NAME#v}"
          if ! grep -q "SCRIPT_VERSION=\"${tag}\"" netbird-delayed-update-linux.sh; then
            echo "Tag '${tag}' does not match SCRIPT_VERSION in netbird-delayed-update-linux.sh" >&2
            exit 1
          fi
